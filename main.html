<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MangoMixer — MangoTango NFT · Mint & Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.9.0/dist/ethers.umd.min.js"></script>
  <style>
    :root {
      --bg: #0c0f0a;
      --surface: #141a12;
      --panel: #1a2218;
      --border: #2d3a28;
      --text: #e8f0e4;
      --muted: #7a8a75;
      --accent: #e8a838;
      --accent-dim: #c48928;
      --mango: #ff9f43;
      --success: #5cb85c;
      --danger: #c45c5c;
      --radius: 12px;
      --radius-sm: 8px;
      --font-sans: "Outfit", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", monospace;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.55;
      background-image:
        radial-gradient(ellipse 100% 60% at 50% -20%, rgba(232, 168, 56, 0.08), transparent 50%),
        radial-gradient(ellipse 80% 40% at 100% 80%, rgba(255, 159, 67, 0.05), transparent);
    }
